# 仅编排参考后端应用；数据库不是本文件交付内容。
# DATABASE_URL 必须指向部署方已经创建并执行唯一 V001 的 MySQL 5.7。
# 本文件不启动数据库容器；mysql:5.7 仅可由本机测试者临时运行。
services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: czur-ai-meeting-reference-api:local
    env_file: .env
    environment:
      AI_MEETING_HTTP_BIND: 0.0.0.0:8080
      AI_MEETING_ARTIFACT_ROOT: /var/lib/meeting/artifacts
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - meeting-artifacts:/var/lib/meeting/artifacts

volumes:
  meeting-artifacts:
