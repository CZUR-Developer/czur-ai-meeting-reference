name: 参考工程检查

on:
  push:
  pull_request:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: 校验 Markdown、JSON 和 Fixture
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for p in Path('.').rglob('*.md'):
              assert p.read_text(encoding='utf-8').count('```') % 2 == 0, p
          for p in Path('contracts').rglob('*.json'):
              json.loads(p.read_text(encoding='utf-8'))
          PY
      - name: 校验目录结构
        run: test -f pom.xml && test -f backend-core/pom.xml && test -f backend-reference/pom.xml && test -f android-reference-app/app/build.gradle.kts
      - name: 公开边界扫描
        run: python3 tools/check-public-boundary.py
      - name: Web 静态构建
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: cd web-reference && npm run check && npm run build
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -f pom.xml test
