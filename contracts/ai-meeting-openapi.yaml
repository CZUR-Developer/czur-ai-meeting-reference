openapi: 3.1.0
info:
  title: AI Meeting Control API
  version: 0.1.0
  description: |
    AI 字幕纪要设备端与后端之间的当前公开控制面协议。
    实时音频和事件使用 realtime.proto；最终结果清单使用
    meeting-manifest.schema.json。模型直连材料只由独立的已认证会话接口返回；
    其它会议控制接口不暴露模型厂商、对象存储路径或 CZUR 内部接口。
    路径摘要中的“（可选扩展）”“（预留，未实现）”标注参考实现状态：可选扩展由
    伙伴自行实现；预留接口按协议保留，参考分发没有对应路由。两类操作当前调用
    都返回 404；探测当前部署的实际能力请用 `GET /v1/capabilities`。
servers:
  - url: https://ai.example.com
tags:
  - name: Discovery
  - name: Profiles
  - name: Meetings
  - name: Artifacts
paths:
  /.well-known/ai-meeting:
    get:
      tags: [Discovery]
      operationId: discoverAiMeetingService
      x-implementation-status: reserved
      summary: （预留，未实现）获取协议、服务能力和限制
      description: |
        参考 HTTP 分发当前没有此路由，调用返回 404。当前部署的能力、语言、音频档和限制
        以 `GET /v1/capabilities` 为准；本操作按协议预留，供后续扩展完整服务发现使用。
      security: []
      responses:
        "200":
          description: 服务描述
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceDescriptor"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /v1/capabilities:
    get:
      tags: [Discovery]
      operationId: getCapabilities
      summary: 获取当前部署支持的能力、语言和限制
      security: []
      responses:
        "200":
          description: 能力描述；与服务发现中的静态能力保持一致
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilitiesResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /v1/product-profiles:
    get:
      tags: [Profiles]
      operationId: listProductProfiles
      x-implementation-status: reserved
      summary: （预留，未实现）获取后端支持的产品档位
      description: |
        参考 HTTP 分发当前没有此路由，调用返回 404。参考部署只装配一个产品档位，由部署
        配置声明；调用方实际可用的能力清单请读取 `GET /v1/capabilities`。本操作按协议
        预留，供需要枚举多个产品档位的部署自行实现。
      security: []
      responses:
        "200":
          description: 产品档位列表
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProductProfile"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /v1/product-profiles/{profileId}:
    get:
      tags: [Profiles]
      operationId: getProductProfile
      x-implementation-status: reserved
      summary: （预留，未实现）获取指定产品档位
      description: |
        参考 HTTP 分发当前没有此路由，调用返回 404。参考部署只装配一个产品档位，能力
        清单以 `GET /v1/capabilities` 为准；本操作按协议预留。
      security: []
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      responses:
        "200":
          description: 产品档位
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductProfile"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /v1/meetings:
    get:
      tags: [Meetings]
      operationId: listMeetings
      description: 参考分发仅接受用户 bearerAuth；security 中的 resultAccessAuth 是伙伴可选扩展，参考实现不启用。
      summary: 查询当前凭证可访问的会议列表
      security:
        - bearerAuth: []
        - resultAccessAuth: []
      parameters:
        - name: pageToken
          in: query
          required: false
          schema:
            type: string
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: 会议列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeetingListResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
    post:
      tags: [Meetings]
      operationId: createMeeting
      summary: 鉴权、预占权益并创建会议
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMeetingRequest"
      responses:
        "201":
          description: 会议创建成功；此时音频流尚未必进入 RUNNING
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateMeetingResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "422":
          $ref: "#/components/responses/ErrorResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /v1/meetings/{meetingId}:
    get:
      tags: [Meetings]
      operationId: getMeeting
      description: 参考分发仅接受用户 bearerAuth；security 中的 resultAccessAuth 是伙伴可选扩展，参考实现不启用。
      summary: 查询会议权威状态
      security:
        - bearerAuth: []
        - resultAccessAuth: []
      parameters:
        - $ref: "#/components/parameters/MeetingId"
      responses:
        "200":
          description: 会议状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeetingStatus"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
    delete:
      tags: [Meetings]
      operationId: deleteMeeting
      description: 参考分发默认以客户端直连模型，此入口未装配，调用返回 501；伙伴自建服务端中转时按本契约实现。
      summary: 撤销访问并异步删除会议及产物
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MeetingId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: 删除请求已受理
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeetingStatus"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /v1/meetings/{meetingId}:stop:
    post:
      tags: [Meetings]
      operationId: stopMeeting
      summary: 幂等结束会议输入并生成最终结果
      description: 旧后端音频会议等待完整音频接管；客户端标准事件会议在最终字幕已经保存时同步生成参考结果。请求形状和鉴权保持一致。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MeetingId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StopMeetingRequest"
      responses:
        "200":
          description: 输入已被后端持久化接管；客户端事件会议的参考结果同时已就绪。同键重试可从此前的 202 推进到此结果，最终 receipt 稳定
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StopMeetingResponse"
        "202":
          description: Stop 意图已持久记录，但音频或最终字幕尚未完成接管；此中间状态和正文不承诺同键固定重放，客户端不得清理本地恢复数据
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StopMeetingResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /v1/meetings/{meetingId}:modelSession:
    post:
      tags: [Meetings]
      operationId: issueModelSession
      summary: 为已创建的会议申请本场模型直连材料
      description: |
        使用用户 Bearer 验证会议归属及创建权限。仅 CREATED/STARTING/RUNNING 可申请；
        按部署配置签发 adapterId 和模型连接材料。听悟模式每次向部署方账号
        新建实时任务；sample-json-ws 模式返回部署方配置的样例 WebSocket
        地址，不创建真实模型任务。Android App 按 adapterId 选构建期注册的
        Adapter 并直连 endpoint，后端只接收归一化的标准事件。听悟 endpoint
        为自带连接凭据的 MeetingJoinUrl，所以 token 省略；expiresAt 是参考
        后端给出的最迟开始连接时间，不表示模型服务端保证的 URL 过期时间。
        Create v1 的 realtime 字段和旧 WSS 音频路径保持原义。
        宿主组合独立文本翻译时，响应可附 translationSession；实时模型只产出原文，
        Android SDK 通过注册的 TranslationAdapter 调用文本模型并提交相同标准译文事件。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MeetingId"
      responses:
        "200":
          description: 单场直连模型的临时材料；不得持久记录或写日志
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelSessionGrant"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /v1/meetings/{meetingId}:startClient:
    post:
      tags: [Meetings]
      operationId: startClientMeeting
      summary: 启动由 Android App 提交标准事件的会议
      description: 仅新客户端事件链路使用；旧 WSS 音频会议继续由 stream_start 启动。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MeetingId"
      responses:
        "200":
          description: 会议已启动或同一客户端入口重放
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartClientMeetingResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /v1/meetings/{meetingId}:translationSession:
    post:
      tags: [Meetings]
      operationId: renewTranslationSession
      summary: 为本场已授权的独立文本翻译续领短期材料
      description: |
        首次翻译材料随 modelSession 返回。SDK 在逐段翻译前发现材料临近到期时调用本接口，
        只续领文本模型材料，不创建 ASR 任务或改变会议状态。使用同场冻结的语言与翻译授权，
        会议归属及 CREATED/STARTING/RUNNING 状态沿用模型材料接口；未装配独立翻译返回501。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MeetingId"
      responses:
        "200":
          description: 同场独立翻译的短期材料，包含 meetingId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranslationSessionGrant"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /v1/meetings/{meetingId}:summarySession:
    post:
      tags: [Meetings]
      operationId: issueSummarySession
      summary: 为本场获准的结构化纪要签发短期文本模型材料
      description: 仅当前用户所属、已调用 startClient 建立客户端输入标记且处于 STARTING 或 RUNNING 的会议可申请；首次 Create 必须请求并获准 summary.structured。宿主通过 SummarySessionIssuer 签发短期材料，默认实现为百炼；Android SDK 按注册的 Adapter 直连模型，后端只接收标准纪要。token 可由签名地址或 initParams 替代；不记录请求或响应中的密钥。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MeetingId"
      responses:
        "200":
          description: 本场一次性文本模型材料
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SummarySessionGrant"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /v1/meetings/{meetingId}/events:append:
    post:
      tags: [Meetings]
      operationId: appendClientMeetingEvent
      summary: App 提交一条已归一化的字幕或译文事件
      description: 接受 transcriptUpsert；本场翻译能力获准时也接受 translationUpsert。App 提供稳定客户端事件 ID 和共同顺序，后端分配权威 eventId、eventSequence 和 emittedAt。模型原始响应不进入此接口。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MeetingId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
                oneOf:
                  - $ref: "#/components/schemas/AppendClientTranscriptRequest"
                  - $ref: "#/components/schemas/AppendClientTranslationRequest"
      responses:
        "201":
          description: 字幕事件已持久化
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeetingEvent"
        "200":
          description: 相同客户端事件与正文的重放，返回首次提交的权威事件
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeetingEvent"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /v1/meetings/{meetingId}/presentation-captures:append:
    post:
      tags: [Meetings]
      operationId: appendPresentationCaptureChunk
      summary: App 顺序上传本场演示截图包
      description: 仅已启动且 Create 时启用 presentationCapture 的客户端会议可上传。每包不可变；chunkSequence 从 1 连续递增，相同序号与内容重放返回 200。帧按数组顺序，offsetMs 为本场开始后的相对毫秒且包内递增。服务端以 presentation.capture JSON 产物写入可替换 ArtifactStore，ArtifactRef.revision 等于 chunkSequence、supersedesArtifactId 为空；Stop 后按包序发布在 Manifest。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MeetingId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppendPresentationCaptureChunkRequest"
      responses:
        "201":
          description: 截图包已保存
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppendPresentationCaptureChunkResponse"
        "200":
          description: 相同截图包的幂等重放
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppendPresentationCaptureChunkResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /v1/meetings/{meetingId}/usage:submit:
    post:
      tags: [Meetings]
      operationId: submitClientMeetingUsage
      summary: App 在停止采音后冻结本场累计采音用量
      description: 仅已启动的客户端事件会议可用。audioDurationMs 来自实际采音字节数；16kHz、单声道、PCM16采用总字节数除以32的整数毫秒，静音计入，模型重发与总结等待不计入。首次提交同时冻结当前 Reservation 版本；相同值可重放，不同值不可覆盖。实测零合法，未知值不提交。后续 Stop 使用该冻结值完成同场结算后生成 READY；Stop 正文仍为空或 {}。旧客户端没有冻结值时保留显示行为，不将未知用量当作零结算。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MeetingId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitClientUsageRequest"
      responses:
        "201":
          description: 实际采音用量已首次冻结
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmitClientUsageResponse"
        "200":
          description: 同场同值的幂等重放
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmitClientUsageResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /v1/meetings/{meetingId}/summary:submit:
    post:
      tags: [Meetings]
      operationId: submitClientMeetingSummary
      summary: App 在 Stop 前提交标准结构化纪要
      description: 仅客户端事件会议可用，且首次 Create 冻结的 summary.structured 能力须获准。规范化 JSON 正文最多 256 KiB；首次提交后不可覆盖，相同正文重放返回 200。后端在 Stop 收口时将其发布为 READY summary.structured Artifact，不调用模型。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MeetingId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitClientSummaryRequest"
      responses:
        "201":
          description: 标准纪要已暂存
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmitClientSummaryResponse"
        "200":
          description: 相同标准纪要的幂等重放
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmitClientSummaryResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /v1/meetings/{meetingId}/speakers/{sessionSpeakerId}:rename:
    post:
      tags: [Meetings]
      operationId: editMeetingSpeakerName
      summary: 修改本场发言人名称，可选登记下次自动识别
      description: |
        可选宿主装配，由 resultSpeakerEditingEnabled 宣告，仅可修改 READY 结果。
        默认参考宿主允许持有效结果链接者编辑：携带原 genTime，无须再次登录。
        授权策略可替换；resultSpeakerEditingRequiresLogin 为 true（或缺席）时，
        使用会议所属账号的 Bearer。参考宿主也兼容无 query 的原 Bearer 调用。
        SINGLE 修改 segmentId 对应段落；ALL 修改本场同一 sessionSpeakerId 的全部段落。
        不改变原文、发言人编号、时间轴或其他会议。先保存本场名称，再执行可选声纹登记。
        transcript.final.segments 的可选 speakerDisplayName 为人工名称；显式 null 表示保留
        未命名编号显示，字段缺席时继续采用 speaker.identity。登记失败仍返回 200 和独立
        registration 状态，调用方重读同一 Manifest，不能把本场保存当作登记成功。
      security:
        - bearerAuth: []
        - {}
      parameters:
        - $ref: "#/components/parameters/MeetingId"
        - name: genTime
          in: query
          required: false
          description: 结果链接编辑时必填，沿用原链接有效期；Bearer 所有者调用不携带。
          schema:
            type: integer
            format: int64
            minimum: -1
        - name: sessionSpeakerId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [displayName, scope, remember]
              properties:
                displayName:
                  type: string
                  minLength: 1
                  maxLength: 128
                scope:
                  type: string
                  enum: [SINGLE, ALL]
                segmentId:
                  type: string
                  description: SINGLE 时必填，须属于路径中的本场发言人。
                remember:
                  type: boolean
                  description: 是否另外登记下次识别，不扩大本场修改范围。
      responses:
        "200":
          description: 本场名称已保存；声纹登记结果单独报告
          content:
            application/json:
              schema:
                type: object
                required: [manifestRevision, changedSegments, registration]
                properties:
                  manifestRevision:
                    type: integer
                  changedSegments:
                    type: integer
                  registration:
                    type: string
                    enum: [NOT_REQUESTED, REGISTERED, SAMPLE_UNAVAILABLE, NOT_GRANTED, UNAVAILABLE]
        default:
          $ref: "#/components/responses/ErrorResponse"
  /v1/meetings/{meetingId}/speakers/{sessionSpeakerId}:enroll:
    post:
      tags: [Meetings]
      operationId: enrollMeetingSpeakerIdentity
      summary: 为本场发言人命名并注册跨会议人物
      description: |
        可选会后人物插件入口，默认关闭。沿用参考或伙伴登录取得的 Bearer 身份，
        不接收 genTime 写权限。仅允许归属匹配、已启用跨会议身份且保留录音的 READY
        客户端会议。成功后发布新版 speaker.identity 并增加原客户端 Manifest revision；
        原文、录音、时间和原结果链接保留。供应商请求在会议行锁事务外完成。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MeetingId"
        - name: sessionSpeakerId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [displayName]
              properties:
                displayName:
                  type: string
                  minLength: 1
                  maxLength: 128
      responses:
        "200":
          description: 标准人物与已更新的 Manifest revision；调用方重新读取原结果链接
          content:
            application/json:
              schema:
                type: object
                required: [personId, displayName, manifestRevision]
                properties:
                  personId:
                    type: string
                  displayName:
                    type: string
                  manifestRevision:
                    type: integer
                    minimum: 1
        default:
          $ref: "#/components/responses/ErrorResponse"
  /v1/meetings/{meetingId}:renewRealtimeToken:
    post:
      tags: [Meetings]
      operationId: renewRealtimeToken
      summary: 已登录会议归属用户续期实时会话 Token
      description: 参考分发默认以客户端直连模型，此入口未装配，调用返回 501；伙伴自建服务端中转时按本契约实现。仅对仍允许实时输入或恢复的会议开放，包括 STOPPING 与 INPUT_COMPLETE_PENDING；新凭据独立持久保存，不改写 Create v1 首次响应。相同幂等键重试返回同一续期结果，新一轮续期须用新键。WSS 握手使用返回的 sessionToken，不接受用户 Bearer 作为实时凭据。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MeetingId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: 新的短期实时凭据；与首次 Create 响应分开保存
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RealtimeTokenGrant"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /v1/meetings/{meetingId}:cancel:
    post:
      tags: [Meetings]
      operationId: cancelMeeting
      x-implementation-status: reserved
      summary: （预留，未实现）幂等取消尚未完成的会议
      description: 参考 HTTP 分发当前没有此路由，调用返回 404；正常结束会议请使用 `:stop`，不要以取消代替收尾。协议保留该操作供后续扩展。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MeetingId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: 取消结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeetingStatus"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /v1/meetings/{meetingId}:issueResultAccess:
    post:
      tags: [Meetings]
      operationId: issueMeetingResultAccess
      x-implementation-status: reserved
      summary: （预留，未实现）由已登录 Android App 签发短期结果 Web 访问凭证
      description: 参考 HTTP 分发当前没有此路由，调用返回 404。默认结果访问使用带 genTime 的结果链接；需要更严格结果控制时可参考 `/v1/result-access` 的可选扩展自行实现。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MeetingId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                ttlSeconds:
                  type: integer
                  minimum: 60
                  maximum: 3600
                  default: 600
      responses:
        "200":
          description: 短期结果访问凭证；参考 Web 不自行登录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultAccessGrant"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /v1/result-access:
    post:
      tags: [Meetings]
      operationId: issueResultAccess
      summary: （可选扩展）由已登录 Android App 签发短期结果端访问凭证
      description: |
        参考 HTTP 分发当前没有此路由，调用返回 404。参考 Web 的标准实现使用 genTime
        结果 URL，不依赖此接口；伙伴需要更严格结果控制时按此扩展自行实现。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueResultAccessRequest"
      responses:
        "200":
          description: 用户范围或指定会议范围的短期结果访问凭证
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultAccessGrant"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /v1/meetings/{meetingId}/events:
    get:
      tags: [Meetings]
      operationId: listMeetingEvents
      summary: 按会议事件序号补拉标准事件
      description: 仅返回会议全局正序号的持久业务事件；audioAck 和 heartbeat 是瞬时 WSS 消息，不在本接口补拉。参考实现仅支持用户 bearerAuth；resultAccessAuth 是伙伴可选扩展。
      security:
        - bearerAuth: []
        - resultAccessAuth: []
      parameters:
        - $ref: "#/components/parameters/MeetingId"
        - name: afterSequence
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 200
      responses:
        "200":
          description: 标准事件页；每项是持久 ServerEnvelope 的 Protobuf JSON Mapping，按会议全局序号读取；全量仍在时允许读取早于最小保证窗口的事件
          content:
            application/json:
              schema:
                type: object
                required: [items, lastSequence, hasMore]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/MeetingEvent"
                  lastSequence:
                    type: integer
                    format: int64
                  hasMore:
                    type: boolean
        "409":
          description: 游标高于最高已提交会议事件序号时返回 INVALID_CURSOR；事实损坏不可伪装为 410
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "410":
          description: 仅在可证明所需历史事件因保留策略已丢失时返回；eventReplayWindow 不是强制截断点
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /v1/meetings/{meetingId}/manifest:
    get:
      tags: [Meetings]
      operationId: getMeetingManifest
      summary: 获取最终会议产物清单
      # 参考 Web 的标准结果访问：opaque meetingId + genTime；不要求 Web 登录。
      # 伙伴如需更严格控制，可在自己的实现中启用可选 resultAccessAuth 扩展。
      security: []
      parameters:
        - $ref: "#/components/parameters/MeetingId"
        - $ref: "#/components/parameters/GenTime"
      responses:
        "200":
          description: 与 meeting-manifest.schema.json 一致的结果清单
          content:
            application/json:
              schema:
                # Canonical result schema is maintained once in the adjacent
                # JSON Schema; implementations must validate against that file.
                $ref: "./meeting-manifest.schema.json"
        "202":
          description: 最终产物仍在生成
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeetingStatus"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /v1/meetings/{meetingId}:sendResultEmail:
    post:
      tags: [Meetings]
      operationId: sendMeetingResultEmail
      summary: 向会前选定邮箱发送本场结果链接
      description: 仅部署方启用邮件通道时可用。核对登录用户的会议归属、Stop 输入接管状态及同一 genTime 结果链接有效期；正文只含链接，不附 PDF。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MeetingId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [recipients, resultUrl]
              properties:
                recipients:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items:
                    type: string
                    format: email
                resultUrl:
                  type: string
                  format: uri
      responses:
        "200":
          description: 结果链接已交给邮件通道发送
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [sent]
                properties:
                  sent:
                    const: true
        default:
          $ref: "#/components/responses/ErrorResponse"
  /v1/artifacts/{artifactId}:
    get:
      tags: [Artifacts]
      operationId: getArtifact
      summary: 获取结果产物内容（genTime 结果 URL）
      description: 参考 Web 通过会议结果 URL 携带的 genTime 读取产物；不要求 Web 单独登录。
      security: []
      parameters:
        - name: artifactId
          in: path
          required: true
          schema:
            type: string
            pattern: "^art_[A-Za-z0-9_-]+$"
        - $ref: "#/components/parameters/GenTime"
      responses:
        "200":
          description: 产物内容；presentation.capture 为 PresentationCaptureArtifact JSON，其余 media type 由 Manifest 中的 ArtifactRef 声明
          content:
            application/json: {}
            text/plain: {}
            text/markdown: {}
            text/html: {}
            application/octet-stream: {}
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /v1/artifacts/{artifactId}:issueAccess:
    post:
      tags: [Artifacts]
      operationId: issueArtifactAccess
      summary: （可选扩展）为有权用户签发短期产物访问授权
      description: |
        参考 HTTP 分发当前没有此路由，调用返回 404。参考 Web 通过 genTime 结果链接读取
        产物，不依赖本操作；伙伴需要短期产物授权时按此扩展自行实现。
      security:
        - bearerAuth: []
        - resultAccessAuth: []
      parameters:
        - name: artifactId
          in: path
          required: true
          schema:
            type: string
            pattern: "^art_[A-Za-z0-9_-]+$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueArtifactAccessRequest"
      responses:
        "200":
          description: 短期访问授权
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueArtifactAccessResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /v1/meetings/{meetingId}:heartbeat:
    post:
      tags: [Meetings]
      operationId: meetingHeartbeat
      summary: 会议存活心跳，记录开始与最后活跃事实
      description: |
        由会议前台服务在会议活跃期间按 Create 响应下发的 heartbeatIntervalMs 周期调用。
        客户端不传时间戳：服务端把首次心跳记为 startedAt、每次心跳刷新 lastActiveAt，
        供弃场收口与用量结算使用。与 WSS 传输层的瞬时 heartbeat 消息无关。
        仅 STARTING／RUNNING 接受；重复调用幂等，只刷新最后活跃时间。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MeetingId"
      responses:
        "200":
          description: 心跳已记录；返回当前部署的期望间隔（毫秒）
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [heartbeatIntervalMs]
                properties:
                  heartbeatIntervalMs:
                    type: integer
                    format: int64
                    minimum: 1000
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          description: 会议不在 STARTING／RUNNING，不能记录心跳
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: 心跳存储暂不可用，可下个周期重试
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        default:
          $ref: "#/components/responses/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: partner-issued-token
    resultAccessAuth:
      type: http
      scheme: bearer
      bearerFormat: optional-short-lived-result-access-token
  parameters:
    ProfileId:
      name: profileId
      in: path
      required: true
      schema:
        type: string
    MeetingId:
      name: meetingId
      in: path
      required: true
      schema:
        type: string
        pattern: "^mtg_[A-Za-z0-9_-]+$"
        maxLength: 1024
    GenTime:
      name: genTime
      in: query
      required: true
      description: 结果 URL 生成时间；服务端按部署配置中的统一有效期判断是否过期；值为 -1 时表示永不过期。
      schema:
        type: integer
        format: int64
        minimum: -1
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
  responses:
    ErrorResponse:
      description: 标准错误
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    ServiceDescriptor:
      type: object
      additionalProperties: false
      required: [specVersion, serviceId, serviceVersion, apiBaseUrl, realtime, supportedContractRange, productProfiles, limits]
      properties:
        specVersion:
          type: string
        serviceId:
          type: string
        serviceVersion:
          type: string
        apiBaseUrl:
          type: string
          format: uri
        realtime:
          $ref: "#/components/schemas/RealtimeDescriptor"
        supportedContractRange:
          type: string
        productProfiles:
          type: array
          items:
            $ref: "#/components/schemas/ProfileRef"
        limits:
          $ref: "#/components/schemas/Limits"
    CapabilitiesResponse:
      type: object
      additionalProperties: false
      required: [specVersion, capabilities, languages, audioProfiles, limits, resultEmailEnabled]
      properties:
        specVersion:
          type: string
        capabilities:
          type: array
          items:
            type: string
        languages:
          type: array
          items:
            type: string
        audioProfiles:
          type: array
          items:
            type: string
        resultLinkTtlMs:
          type: integer
          minimum: 1
          description: 部署结果链接有效期；未开启匿名结果读取时省略。
        resultEmailEnabled:
          type: boolean
          description: 部署方已配置 SMTP 且邮箱交付可用。
        resultSpeakerEditingEnabled:
          type: boolean
          description: 宿主已显式装配本场发言人编辑；缺席时按 false，独立于声纹模型能力。
        resultSpeakerEditingRequiresLogin:
          type: boolean
          description: 编辑入口的授权策略是否需要登录；缺席时按 true。参考宿主为 false，使用有效结果链接；此字段仅指导界面，不替代服务端授权。
        limits:
          $ref: "#/components/schemas/Limits"
    RealtimeDescriptor:
      type: object
      additionalProperties: false
      required: [transport, subprotocol]
      properties:
        transport:
          const: websocket-protobuf
        subprotocol:
          const: czur.ai-meeting.realtime.v1
    Limits:
      type: object
      additionalProperties: false
      required: [maxMeetingDurationMs, maxAudioFrameBytes, eventReplayWindow]
      properties:
        maxMeetingDurationMs:
          type: integer
          format: int64
          minimum: 1
        maxAudioFrameBytes:
          type: integer
          minimum: 1
        eventReplayWindow:
          type: integer
          minimum: 1
          description: 最小保证的会议级可重放事件数；已保留的更老事件仍可读取。
        maxReplayAudioMs:
          type: integer
          minimum: 0
        heartbeatIntervalMs:
          type: integer
          minimum: 1
          description: 客户端下一次心跳的期望间隔（毫秒）；服务端按部署配置回告，不由单场状态推导。服务端据此判定弃场：客户端应持续按该间隔发送心跳，长时间没有活跃的会议会被服务端结算并收口为终态。
    ProfileRef:
      type: object
      additionalProperties: false
      required: [id, revision]
      properties:
        id:
          type: string
        revision:
          type: integer
          minimum: 1
    ProductProfile:
      type: object
      additionalProperties: false
      required: [id, revision, requiredCapabilities, optionalCapabilities, requiredArtifacts, supportedAudioProfiles, supportedLanguages, failurePolicy]
      properties:
        id:
          type: string
        revision:
          type: integer
          minimum: 1
        requiredCapabilities:
          type: array
          uniqueItems: true
          items:
            type: string
        optionalCapabilities:
          type: array
          uniqueItems: true
          items:
            type: string
        requiredArtifacts:
          type: array
          uniqueItems: true
          items:
            type: string
        supportedAudioProfiles:
          type: array
          items:
            type: string
        supportedLanguages:
          type: array
          items:
            type: string
        failurePolicy:
          type: object
          additionalProperties:
            enum: [FAIL_MEETING, READY_WITH_WARNINGS, IGNORE]
    CreateMeetingRequest:
      type: object
      additionalProperties: false
      required: [clientSessionId, profile, client, timezone, languages, audioProfile, requestedCapabilities, artifactPolicy]
      properties:
        clientSessionId:
          type: string
        profile:
          $ref: "#/components/schemas/ProfileRef"
        client:
          $ref: "#/components/schemas/ClientDescriptor"
        title:
          type: string
          maxLength: 256
        timezone:
          type: string
        languages:
          $ref: "#/components/schemas/LanguageSelection"
        audioProfile:
          $ref: "#/components/schemas/AudioProfile"
        requestedCapabilities:
          type: array
          uniqueItems: true
          items:
            type: string
        artifactPolicy:
          $ref: "#/components/schemas/ArtifactPolicy"
    ClientDescriptor:
      type: object
      additionalProperties: false
      required: [appId, appVersion, contractVersion, deviceId]
      properties:
        appId:
          type: string
        appVersion:
          type: string
        contractVersion:
          type: string
        deviceId:
          type: string
          description: 不透明设备标识，不代替用户身份
    LanguageSelection:
      type: object
      additionalProperties: false
      required: [source, targets]
      properties:
        source:
          type: string
        targets:
          type: array
          uniqueItems: true
          items:
            type: string
    AudioProfile:
      type: object
      additionalProperties: false
      required: [encoding, sampleRateHz, channelCount, frameDurationMs]
      properties:
        encoding:
          enum: [PCM_S16LE]
        sampleRateHz:
          type: integer
          enum: [16000]
        channelCount:
          type: integer
          enum: [1]
        frameDurationMs:
          type: integer
          minimum: 20
          maximum: 200
    ArtifactPolicy:
      type: object
      additionalProperties: false
      required: [retainAudio, presentationCapture]
      properties:
        retainAudio:
          type: boolean
        presentationCapture:
          type: boolean
    AppendPresentationCaptureChunkRequest:
      type: object
      additionalProperties: true
      description: 未知属性被忽略且不写入 artifact；必填字段缺失或已知字段非法仍返回 400。
      required: [chunkSequence, frames]
      properties:
        chunkSequence:
          type: integer
          minimum: 1
        frames:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: true
            required: [offsetMs, jpegBase64]
            properties:
              offsetMs:
                type: integer
                minimum: 0
                format: int64
              jpegBase64:
                type: string
                contentEncoding: base64
                contentMediaType: image/jpeg
              ocrText:
                type: string
                maxLength: 8192
                description: 可选 OCR 文本；按 Unicode code point 计数，空白不写入，未知属性忽略。
    AppendPresentationCaptureChunkResponse:
      type: object
      additionalProperties: false
      required: [artifactId, chunkSequence, frameCount]
      properties:
        artifactId:
          type: string
          pattern: "^art_[A-Za-z0-9_-]+$"
        chunkSequence:
          type: integer
          minimum: 1
        frameCount:
          type: integer
          minimum: 1
    SubmitClientUsageRequest:
      type: object
      additionalProperties: false
      required: [audioDurationMs]
      properties:
        audioDurationMs:
          type: integer
          format: int64
          minimum: 0
          maximum: 9223372036854775807
          description: 已停止采音后冻结的累计整数毫秒，零表示实测零。
    SubmitClientUsageResponse:
      type: object
      additionalProperties: false
      required: [meetingId, audioDurationMs, accepted]
      properties:
        meetingId:
          type: string
          pattern: "^mtg_[A-Za-z0-9_-]+$"
          maxLength: 1024
        audioDurationMs:
          type: integer
          format: int64
          minimum: 0
          maximum: 9223372036854775807
        accepted:
          type: boolean
          const: true
    SubmitClientSummaryRequest:
      type: object
      additionalProperties: false
      required: [language, title, overview, keyPoints, actionItems]
      properties:
        language:
          type: string
          minLength: 1
          maxLength: 64
        title:
          type: string
          minLength: 1
          maxLength: 512
        overview:
          type: string
          minLength: 1
          maxLength: 16384
        keyPoints:
          type: array
          maxItems: 100
          items:
            type: string
            minLength: 1
            maxLength: 4096
        actionItems:
          type: array
          maxItems: 100
          items:
            type: string
            minLength: 1
            maxLength: 4096
    SubmitClientSummaryResponse:
      type: object
      additionalProperties: false
      required: [meetingId, accepted]
      properties:
        meetingId:
          type: string
          pattern: "^mtg_[A-Za-z0-9_-]+$"
          maxLength: 1024
        accepted:
          type: boolean
          const: true
    PresentationCaptureArtifact:
      description: presentation.capture 产物正文；由服务端规范化生成，不暴露对象存储位置。
      type: object
      additionalProperties: false
      required: [schemaVersion, chunkSequence, frames]
      properties:
        schemaVersion:
          type: string
          const: presentation-capture/v1
        chunkSequence:
          type: integer
          minimum: 1
        frames:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [offsetMs, jpegBase64]
            properties:
              offsetMs:
                type: integer
                minimum: 0
                format: int64
              jpegBase64:
                type: string
                contentEncoding: base64
                contentMediaType: image/jpeg
              ocrText:
                type: string
                maxLength: 8192
                description: 可选 OCR 文本；按 Unicode code point 计数。
    CreateMeetingResponse:
      type: object
      additionalProperties: false
      required: [meetingId, state, acceptedProfile, grantedCapabilities, capabilityDecisions, acceptedAudioProfile, realtime, limits]
      properties:
        meetingId:
          type: string
          pattern: "^mtg_[A-Za-z0-9_-]+$"
          maxLength: 1024
        state:
          $ref: "#/components/schemas/MeetingState"
        acceptedProfile:
          $ref: "#/components/schemas/ProfileRef"
        grantedCapabilities:
          type: array
          items:
            type: string
        capabilityDecisions:
          type: array
          description: 本场会议最终能力计划；包含已启用、关闭和不可用能力及其原因。fallback 已删除。
          items:
            type: object
            additionalProperties: false
            required: [capability, availability, requiredByProfile]
            properties:
              capability:
                type: string
              availability:
                enum: [AVAILABLE, DEGRADED, UNAVAILABLE]
              reasonCode:
                type: [string, "null"]
              requiredByProfile:
                type: boolean
              fallbackCapability:
                type: [string, "null"]
                deprecated: true
                description: 历史兼容字段；当前后端不再生成降级决策，固定为 null。
        acceptedAudioProfile:
          $ref: "#/components/schemas/AudioProfile"
        realtime:
          type: object
          additionalProperties: false
          required: [url, subprotocol, sessionToken, expiresAt]
          description: 首次 Create v1 响应事实；P2 ASR-only 的 streamId 按公开规则等于 meetingId，续期不会改写本对象。
          properties:
            url:
              type: string
              format: uri
            subprotocol:
              const: czur.ai-meeting.realtime.v1
            sessionToken:
              type: string
              readOnly: true
            expiresAt:
              type: string
              format: date-time
        limits:
          $ref: "#/components/schemas/Limits"
    ModelSessionGrant:
      type: object
      additionalProperties: false
      required: [meetingId, adapterId, endpoint, expiresAt, initParams]
      properties:
        meetingId:
          type: string
          pattern: "^mtg_[A-Za-z0-9_-]+$"
          maxLength: 1024
        adapterId:
          type: string
          description: 构建期注册的 Android ModelAdapter 标识；参考部署可选 tingwu-realtime 或 sample-json-ws。
        endpoint:
          type: string
          format: uri
          description: 模型直连 WebSocket 地址（ws 或 wss）；可能包含临时凭据，禁止日志和持久化。
        token:
          type: string
          description: 仅模型协议单独签发 Token 时提供；听悟 MeetingJoinUrl 模式省略。
        expiresAt:
          type: string
          format: date-time
          description: 客户端最迟开始连接时间；不是厂商服务端保证的 URL 失效时间。
        initParams:
          type: object
          description: Adapter 专用的字符串初始化参数；听悟 Adapter 要求 taskId。
          additionalProperties:
            type: string
          properties:
            taskId:
              type: string
              description: 听悟 StartTranscription/StopTranscription 的 header.task_id。
        translationSession:
          $ref: "#/components/schemas/TranslationSessionGrant"
    TranslationSessionGrant:
      type: object
      additionalProperties: false
      required: [adapterId, endpoint, expiresAt, initParams]
      properties:
        meetingId:
          type: string
          description: 独立续领响应包含本场ID；嵌套在 modelSession 的首次材料不重复此字段。
          pattern: "^mtg_[A-Za-z0-9_-]+$"
          maxLength: 1024
        adapterId:
          type: string
          description: 构建期注册的 TranslationAdapter 标识，样例为 sample-json-translation。
        endpoint:
          type: string
          format: uri
          description: SDK 直连的文本模型地址，可包含短期签名；不得记录到日志或产物。
        expiresAt:
          type: string
          format: date-time
          description: 短期翻译材料过期时间；SDK 在实际翻译前按需续领。
        token:
          type: string
          description: 可选短期令牌，禁止使用供应商长期密钥。
        initParams:
          type: object
          additionalProperties:
            type: string
          description: 对应供应商 Adapter 解释的短期参数，不进入标准结果。
    SummarySessionGrant:
      type: object
      additionalProperties: false
      required: [meetingId, adapterId, endpoint, expiresAt]
      properties:
        meetingId:
          type: string
          pattern: "^mtg_[A-Za-z0-9_-]+$"
          maxLength: 1024
        adapterId:
          type: string
          description: 构建期注册的 SummaryAdapter 标识，默认实现为 bailian-summary。
        endpoint:
          type: string
          format: uri
          description: 文本模型地址，默认百炼应用 completion；正式部署须为 HTTPS。
        expiresAt:
          type: string
          format: date-time
          description: 模型短期材料的服务端过期时间。
        token:
          type: string
          readOnly: true
          description: 可选模型短期材料；仅交给认证 App，不入日志或持久化。
        initParams:
          type: object
          additionalProperties:
            type: string
          description: 非空时返回对应 SummaryAdapter 解释的供应商附加短期参数。
    RealtimeTokenGrant:
      type: object
      additionalProperties: false
      required: [meetingId, streamId, sessionToken, expiresAt]
      properties:
        meetingId:
          type: string
          pattern: "^mtg_[A-Za-z0-9_-]+$"
          maxLength: 1024
        streamId:
          type: string
          description: P2 ASR-only 参考实现中等于 meetingId；续期和重连不换流。
        sessionToken:
          type: string
          readOnly: true
          description: 仅供绑定 meetingId/streamId 的 WSS 握手使用；不得用于 Stop/Cancel/Delete。
        expiresAt:
          type: string
          format: date-time
    StopMeetingRequest:
      type: object
      description: 请求体可省略；若提供 application/json，只允许空对象。流终点由实时 input_complete 提交。
      additionalProperties: false
    StartClientMeetingResponse:
      type: object
      additionalProperties: false
      required: [meetingId, state, inputSource]
      properties:
        meetingId:
          type: string
          pattern: "^mtg_[A-Za-z0-9_-]+$"
          maxLength: 1024
        state:
          enum: [STARTING, RUNNING]
        inputSource:
          const: CLIENT_EVENTS
    AppendClientTranscriptRequest:
      type: object
      additionalProperties: false
      required: [clientEventId, clientSequence, transcriptUpsert]
      properties:
        clientEventId:
          type: string
          minLength: 1
          maxLength: 128
        clientSequence:
          type: integer
          format: int64
          minimum: 1
        transcriptUpsert:
          $ref: "#/components/schemas/ClientTranscriptUpsert"
    AppendClientTranslationRequest:
      type: object
      additionalProperties: false
      required: [clientEventId, clientSequence, translationUpsert]
      properties:
        clientEventId:
          type: string
          minLength: 1
          maxLength: 128
        clientSequence:
          type: integer
          format: int64
          minimum: 1
        translationUpsert:
          $ref: "#/components/schemas/ClientTranslationUpsert"
    ClientTranslationUpsert:
      type: object
      additionalProperties: false
      required: [translationId, sourceSegmentId, revision, operation, sourceLanguage, targetLanguage, text, final, supersedesTranslationIds]
      properties:
        translationId: { type: string, minLength: 1 }
        sourceSegmentId: { type: string, minLength: 1 }
        revision: { type: integer, minimum: 1 }
        operation:
          enum: [UPSERT_OPERATION_UPSERT, UPSERT_OPERATION_REPLACE]
        sourceLanguage: { type: string, minLength: 1 }
        targetLanguage: { type: string, minLength: 1 }
        text: { type: string }
        final: { type: boolean }
        supersedesTranslationIds:
          type: array
          items: { type: string, minLength: 1 }
    ClientTranscriptUpsert:
      type: object
      additionalProperties: false
      required: [segmentId, revision, operation, startMs, endMs, language, text, final]
      properties:
        segmentId:
          type: string
          minLength: 1
        revision:
          type: integer
          minimum: 1
        operation:
          enum: [UPSERT_OPERATION_UPSERT, UPSERT_OPERATION_REPLACE]
        startMs:
          type: integer
          format: int64
          minimum: 0
        endMs:
          type: integer
          format: int64
          minimum: 0
        language:
          type: string
          minLength: 1
        text:
          type: string
        final:
          type: boolean
        speaker:
          type: object
          additionalProperties: false
          required: [sessionSpeakerId]
          description: 仅本场模型给出的临时发言人，不代表跨会议声纹身份。
          properties:
            sessionSpeakerId: { type: string, minLength: 1 }
    StopMeetingResponse:
      type: object
      additionalProperties: false
      required: [meetingId, state, inputState, finalizationReceipt, manifestState]
      properties:
        meetingId:
          type: string
          pattern: "^mtg_[A-Za-z0-9_-]+$"
          maxLength: 1024
        state:
          $ref: "#/components/schemas/MeetingState"
        inputState:
          enum: [INPUT_COMPLETE_PENDING, INPUT_ACCEPTED]
        finalizationReceipt:
          type: [string, "null"]
        manifestState:
          enum: [NOT_STARTED, GENERATING, READY, READY_WITH_WARNINGS, FAILED, DELETION_PENDING, DELETED]
    MeetingStatus:
      type: object
      additionalProperties: false
      required: [meetingId, state, inputState, manifestState, updatedAt]
      properties:
        meetingId:
          type: string
          pattern: "^mtg_[A-Za-z0-9_-]+$"
          maxLength: 1024
        state:
          $ref: "#/components/schemas/MeetingState"
        inputState:
          enum: [INPUT_OPEN, INPUT_COMPLETE_PENDING, INPUT_ACCEPTED, INPUT_CANCELLED]
        manifestState:
          enum: [NOT_STARTED, GENERATING, READY, READY_WITH_WARNINGS, FAILED, DELETION_PENDING, DELETED]
        finalizationReceipt:
          type: [string, "null"]
        updatedAt:
          type: string
          format: date-time
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/Warning"
    MeetingState:
      enum: [UNKNOWN, CREATED, AUTHORIZED, STARTING, RUNNING, STOPPING, FINALIZING, READY, READY_WITH_WARNINGS, FAILED, CANCELLED, DELETION_PENDING, DELETED]
    MeetingListResponse:
      type: object
      additionalProperties: false
      required: [items, nextPageToken]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MeetingSummary"
        nextPageToken:
          type: [string, "null"]
    MeetingSummary:
      type: object
      additionalProperties: false
      required: [meetingId, title, state, inputState, manifestState, createdAt, updatedAt]
      properties:
        meetingId:
          type: string
          pattern: "^mtg_[A-Za-z0-9_-]+$"
          maxLength: 1024
        title:
          type: [string, "null"]
        state:
          $ref: "#/components/schemas/MeetingState"
        inputState:
          enum: [INPUT_OPEN, INPUT_COMPLETE_PENDING, INPUT_ACCEPTED, INPUT_CANCELLED]
        manifestState:
          enum: [NOT_STARTED, GENERATING, READY, READY_WITH_WARNINGS, FAILED, DELETION_PENDING, DELETED]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    MeetingEvent:
      type: object
      additionalProperties: false
      description: 会议全局正序的持久 ServerEnvelope JSON 表示；streamId 是必填来源元数据而非分页过滤条件；audioAck/heartbeat 不在此 Schema 内。
      required: [specVersion, eventId, meetingId, streamId, eventSequence, emittedAt]
      properties:
        specVersion:
          type: string
        eventId:
          type: string
        meetingId:
          type: string
          pattern: "^mtg_[A-Za-z0-9_-]+$"
          maxLength: 1024
        streamId:
          type: string
          description: P2 ASR-only 参考流固定等于 meetingId，重连不换流。
        eventSequence:
          type: string
          pattern: "^[1-9][0-9]*$"
          description: 按 meetingId 全局分配的已提交正序号；Protobuf JSON Mapping 中 uint64 使用十进制字符串。
        emittedAt:
          type: string
          format: date-time
        sessionState:
          type: object
          additionalProperties: true
        transcriptUpsert:
          type: object
          additionalProperties: true
        translationUpsert:
          type: object
          additionalProperties: true
        speakerUpdate:
          type: object
          additionalProperties: true
        capabilityChanged:
          type: object
          additionalProperties: true
        finalization:
          type: object
          additionalProperties: true
        error:
          type: object
          additionalProperties: true
        audioContinuity:
          type: object
          additionalProperties: true
      oneOf:
        - required: [sessionState]
        - required: [transcriptUpsert]
        - required: [translationUpsert]
        - required: [speakerUpdate]
        - required: [capabilityChanged]
        - required: [finalization]
        - required: [error]
        - required: [audioContinuity]
    IssueArtifactAccessRequest:
      type: object
      additionalProperties: false
      required: [disposition, ttlSeconds]
      properties:
        disposition:
          enum: [INLINE, ATTACHMENT]
        ttlSeconds:
          type: integer
          minimum: 30
          maximum: 3600
    IssueArtifactAccessResponse:
      type: object
      additionalProperties: false
      required: [artifactId, accessUrl, expiresAt, headers]
      properties:
        artifactId:
          type: string
        accessUrl:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time
        headers:
          type: object
          additionalProperties:
            type: string
    ResultAccessGrant:
      type: object
      additionalProperties: false
      required: [meetingId, accessToken, expiresAt, scopes]
      properties:
        meetingId:
          type: [string, "null"]
          pattern: "^mtg_[A-Za-z0-9_-]+$"
          maxLength: 1024
          description: 用户范围授权时为空；单会议授权时为会议 ID。
        accessToken:
          type: string
          readOnly: true
        expiresAt:
          type: string
          format: date-time
        scopes:
          type: array
          uniqueItems: true
          items:
            enum: [MEETING_LIST, MEETING_READ, ARTIFACT_READ, ARTIFACT_EXPORT]
    IssueResultAccessRequest:
      type: object
      additionalProperties: false
      required: [scopes, ttlSeconds]
      properties:
        meetingId:
          type: [string, "null"]
          pattern: "^mtg_[A-Za-z0-9_-]+$"
          maxLength: 1024
          description: 为空表示用户范围授权；非空表示单会议授权。
        scopes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            enum: [MEETING_LIST, MEETING_READ, ARTIFACT_READ, ARTIFACT_EXPORT]
        ttlSeconds:
          type: integer
          minimum: 60
          maximum: 3600
    Warning:
      type: object
      additionalProperties: false
      required: [code, messageKey]
      properties:
        code:
          type: string
        messageKey:
          type: string
        diagnosticId:
          type: string
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [specVersion, error]
      properties:
        specVersion:
          type: string
        error:
          type: object
          additionalProperties: false
          required: [domain, code, severity, retryable, userAction, messageKey, diagnosticId]
          properties:
            domain:
              enum: [CONTRACT, IDENTITY, ENTITLEMENT, SESSION, AUDIO, NETWORK, MODEL, STORAGE, SUMMARY, INTERNAL]
            code:
              type: string
            severity:
              enum: [WARNING, FATAL]
            retryable:
              type: boolean
            retryAfterMs:
              type: [integer, "null"]
              minimum: 0
            userAction:
              enum: [NONE, RETRY, LOGIN, CONTACT_ADMIN, CHECK_NETWORK, FREE_STORAGE]
            messageKey:
              type: string
            diagnosticId:
              type: string
security:
  - bearerAuth: []
