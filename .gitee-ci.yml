name: reference-check

stages:
  - verify

verify:
  stage: verify
  image: maven:3.9-eclipse-temurin-21
  script:
    - mvn -B -f backend-reference/pom.xml test
    - test -f android-reference-app/app/build.gradle.kts
    - test -f LICENSE
    - test -f NOTICE
    - python3 tools/check-public-boundary.py
    - cd web-reference && npm run check && npm run build
